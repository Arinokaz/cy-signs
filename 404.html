<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting... | Cyprus Road Signs</title>
    <script>
        // GitHub Pages redirect for clean URLs
        // /en → index.html з встановленою мовою
        
        const path = window.location.pathname; // "/en"
        const pathLang = path.replace('/', '') || '';
        const supportedLangs = ['en', 'uk', 'el', 'ru'];
        
        if (supportedLangs.includes(pathLang)) {
            // Redirect to index.html з мовою
            const newUrl = window.location.origin + window.location.pathname.replace('/' + pathLang, '') + '/?lang=' + pathLang;
            window.location.replace(newUrl);
        } else {
            // Не мова — редирект на головну
            window.location.replace(window.location.origin);
        }
    </script>
</head>
<body>
    <p>Redirecting to Cyprus Road Signs Quiz...</p>
</body>
</html>
